<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolidSketch interface prototype</title>
<style>
  :root{
    --paper:#f4f0e6; --paper-2:#ebe5d6; --ink:#27334d; --ink-2:#56627c; --line:#d8d0bd;
    --coral:#e8704f; --coral-soft:#fbe3da; --panel:#fbf9f3; --shadow:0 1px 0 rgba(39,51,77,.06),0 6px 18px rgba(39,51,77,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:14px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
  .app{display:grid;grid-template-columns:68px 1fr 248px;grid-template-rows:48px 1fr 34px;height:100vh;min-height:520px}
  header{grid-column:1/4;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
  .brand svg{width:26px;height:26px}
  .doc{color:var(--ink-2);font-weight:500}
  .sp{flex:1}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip:hover{border-color:var(--ink-2)}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
  .icon-btn:hover{background:var(--paper-2)}
  .icon-btn svg{width:20px;height:20px}
  nav{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;overflow:auto}
  nav button{position:relative;width:48px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
  nav button svg{width:24px;height:24px}
  nav button:hover{background:var(--paper-2)}
  nav button[aria-pressed=true]{background:var(--coral-soft);border-color:var(--coral);color:#a63c1f}
  nav button.planned{opacity:.55}
  nav button kbd{position:absolute;right:4px;bottom:2px;font:600 9px/1 ui-monospace,monospace;color:var(--ink-2)}
  nav hr{width:34px;border:0;border-top:1px solid var(--line);margin:4px 0}
  main{position:relative;overflow:hidden;background:var(--paper)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vcb{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ink);border-radius:8px;padding:2px 8px;font:600 13px ui-monospace,monospace;box-shadow:var(--shadow);display:none}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
  aside h3{margin:0 0 8px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-2)}
  .sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sw button{aspect-ratio:1;border-radius:10px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--coral)}
  .sw-name{margin-top:8px;color:var(--ink-2);font-size:12px}
  .info{color:var(--ink-2);font-size:13px;min-height:54px}
  .info b{color:var(--ink)}
  label.row{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
  input[type=range]{flex:1;accent-color:var(--coral)}
  footer{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line)}
  footer .hint{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer .hint b{color:var(--ink)}
  footer .box{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
  footer .box span{min-width:92px;text-align:right;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font:600 13px ui-monospace,monospace;color:var(--ink)}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  @media (max-width:820px){.app{grid-template-columns:60px 1fr}aside{display:none}header,footer{grid-column:1/3}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="#27334d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
        <path d="M16 3 28 9.5v13L16 29 4 22.5v-13z" fill="#fbe3da"/><path d="M4 9.5 16 16l12-6.5M16 16v13"/>
      </svg>
      SolidSketch
    </div>
    <span class="doc">Garden studio</span>
    <button class="icon-btn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -4)"/></svg></button>
    <div class="sp"></div>
    <button class="chip" id="style" aria-pressed="false" title="Draw edges like a pencil">Sketchy edges</button>
    <button class="chip" id="top" aria-pressed="false" title="Look straight down">Plan view</button>
  </header>

  <nav id="tools" aria-label="Tools"></nav>

  <main id="stage">
    <canvas id="c"></canvas>
    <div class="vcb" id="vcb"></div>
    <div class="toast" id="toast"></div>
  </main>

  <aside>
    <section>
      <h3>Materials</h3>
      <div class="sw" id="swatches"></div>
      <div class="sw-name" id="swname"></div>
    </section>
    <section>
      <h3>Selection</h3>
      <div class="info" id="info">Nothing selected.</div>
    </section>
    <section>
      <h3>Light</h3>
      <label class="row">Shadows <input type="range" id="shadow" min="0" max="100" value="55"></label>
    </section>
  </aside>

  <footer>
    <div class="hint" id="hint"></div>
    <div class="box">Distance <span id="readout">&nbsp;</span></div>
  </footer>
</div>

<script>
"use strict";
/* A design prototype of the SolidSketch interface: how the tools feel, not the app itself.
   The real tools are in crates/tools (Rust); the hints below are copied from tool.rs. */

const TOOLS = [
  {id:'select',label:'Select',key:' ',kb:'␣',hint:'Click a face, edge or object. Shift adds to the selection.',
   icon:'<path d="M6 3l12 8-5.5 1.5L10 18z"/>'},
  {id:'line',label:'Line',key:'L',hint:'Click to start. Click again for each corner. Type a length and press Enter.',
   icon:'<path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.6" fill="currentColor"/><circle cx="19" cy="5" r="1.6" fill="currentColor"/>'},
  {id:'rect',label:'Rectangle',key:'R',hint:'Click one corner, then the opposite one. Type width, height and press Enter.',
   icon:'<rect x="4" y="7" width="16" height="10" rx="1"/>'},
  {id:'circle',label:'Circle',key:'C',hint:'Click the centre, then drag out the radius. Type a radius and press Enter.',
   icon:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>'},
  {id:'pushpull',label:'Push/Pull',key:'P',hint:'Click a face, then pull it out or push it in. Type a distance and press Enter.',
   icon:'<path d="M4 15 12 19l8-4V9l-8 4-8-4z"/><path d="M12 13v-9M9 7l3-3 3 3"/>'},
  {id:'move',label:'Move',key:'M',hint:'Click what to move, then click where it goes.',
   icon:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>'},
  {id:'rotate',label:'Rotate',key:'Q',planned:1,hint:'Click what to turn, set the pivot, then swing it.',
   icon:'<path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M19 4v4h-4"/>'},
  {id:'scale',label:'Scale',key:'S',planned:1,hint:'Click what to resize, then drag a handle.',
   icon:'<rect x="4" y="10" width="10" height="10" rx="1"/><path d="M14 10 20 4M15 4h5v5"/>'},
  {id:'follow',label:'Follow Me',key:'F',planned:1,hint:'Pick a path, then click the shape to sweep along it.',
   icon:'<path d="M4 18c6 0 4-12 10-12h6"/><circle cx="6" cy="18" r="2"/>'},
  {id:'paint',label:'Paint',key:'B',hint:'Pick a colour or material, then click faces to paint them.',
   icon:'<path d="M5 12 12 5l7 7-7 7z"/><path d="M19 15c1.5 2 1.5 3.2 0 4s-2.5-.2-2-1.5z" fill="currentColor"/>'},
  {id:'tape',label:'Tape Measure',key:'T',hint:'Click two points to measure the distance between them.',
   icon:'<rect x="3" y="9" width="18" height="6" rx="1"/><path d="M7 9v3M11 9v2M15 9v3M19 9v2"/>'},
  {id:'orbit',label:'Orbit',key:'O',hint:'Drag to look around. Scroll to zoom. Hold Shift to pan.',
   icon:'<ellipse cx="12" cy="12" rx="9" ry="4.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/>'},
];

const MATERIALS = [
  ['Plaster','#efe6d2'],['Brick','#b9573c'],['Sage','#9db39a'],['Slate','#5d6b7e'],
  ['Oak','#c79a62'],['Sky','#a9c8dc'],['Terracotta','#d9825b'],['Moss','#6f8f5a'],
  ['Cream','#f7f1e1'],['Plum','#7d5a7a'],['Sun','#efc65b'],['Charcoal','#3b4252'],
];

const $ = s => document.querySelector(s);
const cv = $('#c'), g = cv.getContext('2d');
const S = { tool:'select', yaw:0.16, scale:36, panX:30, panY:60, top:false, sketchy:false,
  mat:1, shadow:.55, sel:null, objs:[], marks:[], undo:[], tmp:null, mouse:{x:0,y:0}, typed:'', tape:null };

/* ---- scene ------------------------------------------------------------ */
let nextId = 1;
const box = (x,y,w,d,h,faces={}) => ({id:nextId++,kind:'box',x,y,w,d,h,faces});
const roof = (base,rise,faces={}) => ({id:nextId++,kind:'roof',base,rise,faces});
function startScene(){
  const house = box(-3,-2,6,4,2.4,{left:0,right:0,top:0,back:0,front:0});
  const porch = box(-1,2,2,1.4,.9,{left:4,right:4,top:4,back:4,front:4});
  const tower = box(-4.4,-2.6,1.8,1.8,4.2,{left:0,right:0,top:0,back:0,front:0});
  const shed  = box(4,1,1.8,1.6,1.4,{left:7,right:7,top:3,back:7,front:7});
  S.objs = [house, porch, tower, shed,
    roof(house.id,1.6,{left:6,right:1,gableA:0,gableB:0}),
    roof(tower.id,1.9,{left:6,right:1,gableA:0,gableB:0})];
  S.marks = [];
  S.sel = null;
}
const byId = id => S.objs.find(o => o.id === id);

/* ---- projection ------------------------------------------------------- */
const COS30 = Math.cos(Math.PI/6), SIN30 = .5;
function rot(x,y){ const c=Math.cos(S.yaw), s=Math.sin(S.yaw); return [x*c-y*s, x*s+y*c]; }
function unrot(x,y){ const c=Math.cos(S.yaw), s=Math.sin(S.yaw); return [x*c+y*s, -x*s+y*c]; }
function proj(x,y,z){
  const [rx,ry] = rot(x,y), k = S.scale, ox = cv.clientWidth/2 + S.panX, oy = cv.clientHeight*.56 + S.panY;
  if (S.top) return [ox + rx*k*1.1, oy + ry*k*1.1 - z*k*.15];
  return [ox + (rx-ry)*COS30*k, oy + (rx+ry)*SIN30*k - z*k];
}
function groundAt(px,py){          // screen point -> point on the ground plane (z = 0)
  const k = S.scale, ox = cv.clientWidth/2 + S.panX, oy = cv.clientHeight*.56 + S.panY;
  let rx, ry;
  if (S.top){ rx=(px-ox)/(k*1.1); ry=(py-oy)/(k*1.1); }
  else { const a=(px-ox)/(COS30*k), b=(py-oy)/(SIN30*k); rx=(a+b)/2; ry=(b-a)/2; }
  return unrot(rx,ry);
}
const snap = v => Math.round(v*4)/4;

/* ---- faces ------------------------------------------------------------ */
function topOf(o){ return o.kind==='box' ? o.h : byId(o.base).h; }
function facesOf(o){
  const out = [];
  if (o.kind==='box'){
    const {x,y,w,d,h} = o, P = (a,b,c)=>[x+a*w,y+b*d,c*h];
    const side = (key,pts,nx,ny,shade) => out.push({o,key,pts,nx,ny,shade});
    side('left', [P(0,1,0),P(1,1,0),P(1,1,1),P(0,1,1)], 0,1,.84);
    side('right',[P(1,1,0),P(1,0,0),P(1,0,1),P(1,1,1)], 1,0,.68);
    side('back', [P(0,0,0),P(0,1,0),P(0,1,1),P(0,0,1)],-1,0,.68);
    side('front',[P(1,0,0),P(0,0,0),P(0,0,1),P(1,0,1)], 0,-1,.84);
    out.push({o,key:'top',pts:[P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)],top:true,shade:1});
  } else {
    const b = byId(o.base); if(!b) return out;
    const z0=b.h, z1=b.h+o.rise, {x,y,w,d}=b, m=(x0,y0,z)=>[x+x0*w,y+y0*d,z];
    // ridge runs along x
    const R0=m(0,.5,z1), R1=m(1,.5,z1);
    out.push({o,key:'left', pts:[m(0,1,z0),m(1,1,z0),R1,R0],nx:0,ny:1,shade:.8,slope:true});
    out.push({o,key:'right',pts:[m(1,0,z0),m(0,0,z0),R0,R1],nx:0,ny:-1,shade:.95,slope:true});
    out.push({o,key:'gableA',pts:[m(1,1,z0),m(1,0,z0),R1],nx:1,ny:0,shade:.7});
    out.push({o,key:'gableB',pts:[m(0,0,z0),m(0,1,z0),R0],nx:-1,ny:0,shade:.7});
  }
  return out;
}
function visible(f){
  if (f.top) return true;
  if (S.top) return false;
  const [nx,ny] = rot(f.nx,f.ny); return nx+ny > 0.001;
}
function depthOf(o){
  let cx,cy,cz;
  if (o.kind==='box'){ cx=o.x+o.w/2; cy=o.y+o.d/2; cz=o.h/2; }
  else { const b=byId(o.base); cx=b.x+b.w/2; cy=b.y+b.d/2; cz=b.h+o.rise; }
  const [rx,ry] = rot(cx,cy); return rx+ry + cz*.01 + (o.kind==='roof'?.02:0);
}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16), r=(n>>16)&255, gr=(n>>8)&255, b=n&255;
  const f=c=>Math.max(0,Math.min(255,Math.round(c*k)));
  return `rgb(${f(r)},${f(gr)},${f(b)})`;
}
const jit = (i,a) => Math.sin(i*12.9898+a*78.233)*.5;

/* ---- drawing ---------------------------------------------------------- */
function fit(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
  cv.width = r.width*dpr; cv.height = r.height*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function path(pts, closed=true){
  g.beginPath(); pts.forEach((p,i)=> i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); if(closed) g.closePath();
}
function drawGrid(){
  g.save(); g.lineWidth=1;
  for (let i=-14;i<=14;i++){
    g.strokeStyle = i===0 ? 'rgba(39,51,77,.0)' : 'rgba(39,51,77,.07)';
    path([proj(i,-14,0),proj(i,14,0)],false); g.stroke();
    path([proj(-14,i,0),proj(14,i,0)],false); g.stroke();
  }
  // axes: warm red, green, blue, as gentle guides
  const ax=(a,b,c)=>{ g.strokeStyle=c; g.lineWidth=1.6; path([proj(...a),proj(...b)],false); g.stroke(); };
  ax([-14,0,0],[14,0,0],'rgba(214,92,76,.55)'); ax([0,-14,0],[0,14,0],'rgba(94,160,96,.55)');
  g.restore();
}
function drawShadow(o){
  if (S.shadow<=0) return;
  let b = o.kind==='box' ? o : byId(o.base); if(!b || o.kind==='roof') return;
  const L=[ .55,.35 ], h=b.h, pts=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.d],[b.x,b.y+b.d]];
  const sh = pts.map(([x,y])=>proj(x+L[0]*h,y+L[1]*h,0)), base=pts.map(([x,y])=>proj(x,y,0));
  g.fillStyle=`rgba(39,51,77,${.16*S.shadow})`;
  // hull of base + shifted base, drawn as the union of quads (cheap and good enough here)
  for (let i=0;i<4;i++){ const j=(i+1)%4; path([base[i],base[j],sh[j],sh[i]]); g.fill(); }
  path(sh); g.fill();
}
function strokeEdges(pts, sel){
  g.lineJoin='round'; g.lineCap='round';
  g.strokeStyle = sel ? '#e8704f' : 'rgba(39,51,77,.78)'; g.lineWidth = sel ? 2.4 : 1.25;
  if (!S.sketchy){ path(pts); g.stroke(); return; }
  for (let pass=0; pass<2; pass++){
    g.lineWidth = pass? .8 : 1.35; g.globalAlpha = pass? .55 : .9;
    path(pts.map((p,i)=>[p[0]+jit(i,pass+1)*1.6, p[1]+jit(i+3,pass+2)*1.6])); g.stroke();
  }
  g.globalAlpha = 1;
}
let hitFaces = [];
function draw(){
  g.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  hitFaces = [];
  drawGrid();
  const order = [...S.objs].sort((a,b)=>depthOf(a)-depthOf(b));
  order.forEach(drawShadow);
  order.forEach(o=>{
    facesOf(o).filter(visible).sort((a,b)=>(a.top?1:0)-(b.top?1:0)).forEach(f=>{
      const pts = f.pts.map(p=>proj(...p)), mat = o.faces[f.key] ?? 0;
      g.fillStyle = shade(MATERIALS[mat][1], f.shade); path(pts); g.fill();
      strokeEdges(pts, S.sel && S.sel.o===o && S.sel.key===f.key);
      hitFaces.push({f,pts});
    });
  });
  S.marks.forEach(drawMark);
  drawTool();
}
function drawMark(m){
  g.save(); g.strokeStyle='rgba(39,51,77,.85)'; g.lineWidth=1.6; g.lineJoin='round';
  if (m.t==='line') path(m.p.map(p=>proj(p[0],p[1],0)), false);
  if (m.t==='circle'){ g.beginPath(); for(let i=0;i<=48;i++){const a=i/48*Math.PI*2; const p=proj(m.c[0]+Math.cos(a)*m.r,m.c[1]+Math.sin(a)*m.r,0); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);} }
  if (m.t==='tape'){ g.strokeStyle='#e8704f'; g.setLineDash([6,4]); path([proj(m.a[0],m.a[1],0),proj(m.b[0],m.b[1],0)],false); }
  g.stroke(); g.restore();
  if (m.t==='tape'){
    const a=proj(m.a[0],m.a[1],0), b=proj(m.b[0],m.b[1],0), len=Math.hypot(m.a[0]-m.b[0],m.a[1]-m.b[1]).toFixed(2);
    g.fillStyle='#fff'; g.strokeStyle='#e8704f'; const x=(a[0]+b[0])/2, y=(a[1]+b[1])/2;
    g.beginPath(); g.roundRect(x-26,y-12,52,24,8); g.fill(); g.stroke();
    g.fillStyle='#27334d'; g.font='600 12px ui-monospace,monospace'; g.textAlign='center'; g.fillText(len,x,y+4);
  }
}
function drawTool(){
  const t = S.tmp; if(!t) return;
  g.save(); g.strokeStyle='#e8704f'; g.fillStyle='rgba(232,112,79,.14)'; g.lineWidth=2; g.setLineDash([7,5]);
  if (t.t==='rect'){ const [a,b]=[t.a,t.b]; const pts=[proj(a[0],a[1],0),proj(b[0],a[1],0),proj(b[0],b[1],0),proj(a[0],b[1],0)]; path(pts); g.fill(); g.stroke(); }
  if (t.t==='circle'){ g.beginPath(); for(let i=0;i<=48;i++){const a=i/48*Math.PI*2; const p=proj(t.c[0]+Math.cos(a)*t.r,t.c[1]+Math.sin(a)*t.r,0); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);} g.fill(); g.stroke(); }
  if (t.t==='line'){ path([...t.p,t.cur].map(p=>proj(p[0],p[1],0)),false); g.stroke(); }
  if (t.t==='tape'){ path([proj(t.a[0],t.a[1],0),proj(t.cur[0],t.cur[1],0)],false); g.stroke(); }
  g.restore();
}

/* ---- picking ---------------------------------------------------------- */
function inside(p,pts){
  let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if((yi>p.y)!==(yj>p.y) && p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi) c=!c;
  } return c;
}
function pick(x,y){ for(let i=hitFaces.length-1;i>=0;i--) if(inside({x,y},hitFaces[i].pts)) return hitFaces[i].f; return null; }

/* ---- UI --------------------------------------------------------------- */
function mountTools(){
  const nav = $('#tools');
  TOOLS.forEach((t,i)=>{
    if (i===1||i===4||i===9) nav.appendChild(document.createElement('hr'));
    const b = document.createElement('button');
    b.dataset.id=t.id; b.title=`${t.label} (${t.key===' '?'Space':t.key})${t.planned?' - planned':''}`; b.setAttribute('aria-label',t.label);
    if (t.planned) b.classList.add('planned');
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg><kbd>${t.kb||t.key}</kbd>`;
    b.onclick = ()=>setTool(t.id); nav.appendChild(b);
  });
  const sw = $('#swatches');
  MATERIALS.forEach(([n,c],i)=>{ const b=document.createElement('button'); b.style.background=c; b.title=n; b.setAttribute('aria-label',n); b.onclick=()=>{S.mat=i; setTool('paint'); syncMat();}; sw.appendChild(b); });
}
function syncMat(){
  [...$('#swatches').children].forEach((b,i)=>b.setAttribute('aria-pressed', i===S.mat));
  $('#swname').textContent = MATERIALS[S.mat][0];
}
function setTool(id){
  S.tool=id; S.tmp=null; S.typed=''; vcb();
  [...document.querySelectorAll('#tools button')].forEach(b=>b.setAttribute('aria-pressed', b.dataset.id===id));
  const t = TOOLS.find(t=>t.id===id);
  $('#hint').innerHTML = `<b>${t.label}.</b> ${t.hint}${t.planned?' <i>(Planned for a later phase.)</i>':''}`;
  cv.style.cursor = id==='orbit' ? 'grab' : id==='select' ? 'default' : 'crosshair';
  draw();
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),1800); }
function vcb(){
  const el = $('#vcb'), ro = $('#readout');
  let txt = S.typed || (S.tmp && S.tmp.read) || '';
  ro.innerHTML = txt || '&nbsp;';
  if (txt && S.tmp){ el.style.display='block'; el.textContent=txt; el.style.left=(S.mouse.x+16)+'px'; el.style.top=(S.mouse.y+16)+'px'; }
  else el.style.display='none';
}
function describe(f){
  if(!f){ $('#info').textContent='Nothing selected.'; return; }
  const o=f.o, name = o.kind==='box' ? 'Block' : 'Roof';
  const dims = o.kind==='box' ? `${o.w} × ${o.d} × ${(+o.h).toFixed(2)}` : `rise ${(+o.rise).toFixed(2)}`;
  $('#info').innerHTML = `<b>${name}</b>, ${f.key} face<br>${dims}<br>${MATERIALS[o.faces[f.key]??0][0]}`;
}
function snapshot(){ S.undo.push(JSON.stringify({objs:S.objs,marks:S.marks})); if(S.undo.length>60) S.undo.shift(); }
function undo(){ const s=S.undo.pop(); if(!s) return; const d=JSON.parse(s); S.objs=d.objs; S.marks=d.marks; S.sel=null; describe(null); draw(); }

/* ---- pointer ---------------------------------------------------------- */
let drag=null;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; S.mouse={x,y};
  const gp = groundAt(x,y).map(snap), f = pick(x,y), t=S.tool;
  if (t==='orbit' || e.button===1 || e.button===2){ drag={k:'orbit',x,yaw:S.yaw}; return; }
  if (t==='select'){ S.sel=f; describe(f); draw(); return; }
  if (t==='paint'){ if(f){ snapshot(); f.o.faces[f.key]=S.mat; S.sel=f; describe(f); draw(); } return; }
  if (t==='pushpull'){
    if (f && f.top && f.o.kind==='box'){ snapshot(); drag={k:'pull',o:f.o,y,h0:f.o.h}; S.tmp={t:'pull',read:'0'}; S.sel=f; describe(f); }
    else toast('Pull on a top face in this prototype');
    return;
  }
  if (t==='move'){ if(f){ snapshot(); const o=f.o.kind==='box'?f.o:byId(f.o.base); drag={k:'move',o,g0:gp,x0:o.x,y0:o.y}; } return; }
  if (t==='rect'){
    if(!S.tmp) S.tmp={t:'rect',a:gp,b:gp,read:''};
    else commitRect(); return;
  }
  if (t==='circle'){
    if(!S.tmp) S.tmp={t:'circle',c:gp,r:0,read:''};
    else { if(S.tmp.r>0){ snapshot(); S.marks.push({t:'circle',c:S.tmp.c,r:S.tmp.r}); } S.tmp=null; S.typed=''; vcb(); draw(); } return;
  }
  if (t==='line'){
    if(!S.tmp) S.tmp={t:'line',p:[gp],cur:gp,read:''};
    else { const f0=S.tmp.p[0]; if(S.tmp.p.length>=3 && gp[0]===f0[0] && gp[1]===f0[1]) endLine(true); else S.tmp.p.push(gp); }
    draw(); return;
  }
  if (t==='tape'){
    if(!S.tmp) S.tmp={t:'tape',a:gp,cur:gp,read:'0'};
    else { snapshot(); S.marks=S.marks.filter(m=>m.t!=='tape'); S.marks.push({t:'tape',a:S.tmp.a,b:gp}); S.tmp=null; vcb(); draw(); } return;
  }
  if (TOOLS.find(q=>q.id===t).planned) toast('This tool arrives in a later phase');
});
cv.addEventListener('pointermove', e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; S.mouse={x,y};
  const gp=groundAt(x,y).map(snap), T=S.tmp;
  if (drag){
    if (drag.k==='orbit'){ S.yaw = drag.yaw + (x-drag.x)*.008; draw(); }
    if (drag.k==='pull'){ const dh = Math.round((drag.y-y)/S.scale*4)/4; drag.o.h=Math.max(.25,drag.h0+dh); S.tmp.read=(drag.o.h-drag.h0).toFixed(2); vcb(); draw(); }
    if (drag.k==='move'){ drag.o.x=drag.x0+gp[0]-drag.g0[0]; drag.o.y=drag.y0+gp[1]-drag.g0[1]; draw(); }
    return;
  }
  if (T){
    if (T.t==='rect'){ T.b=gp; T.read=`${Math.abs(gp[0]-T.a[0])}, ${Math.abs(gp[1]-T.a[1])}`; }
    if (T.t==='circle'){ T.r=Math.hypot(gp[0]-T.c[0],gp[1]-T.c[1]); T.read=T.r.toFixed(2); }
    if (T.t==='line'){ const l=T.p[T.p.length-1]; T.cur=gp; T.read=Math.hypot(gp[0]-l[0],gp[1]-l[1]).toFixed(2); }
    if (T.t==='tape'){ T.cur=gp; T.read=Math.hypot(gp[0]-T.a[0],gp[1]-T.a[1]).toFixed(2); }
    vcb(); draw();
  }
});
cv.addEventListener('pointerup', ()=>{
  if (drag && drag.k==='pull'){ S.tmp=null; S.typed=''; vcb(); }
  drag=null; draw();
});
cv.addEventListener('wheel', e=>{ e.preventDefault(); S.scale=Math.max(18,Math.min(120,S.scale*(e.deltaY<0?1.08:.92))); draw(); },{passive:false});
cv.addEventListener('contextmenu', e=>e.preventDefault());

function commitRect(){
  const T=S.tmp; let [ax,ay]=T.a, [bx,by]=T.b;
  const v=S.typed.split(/[,;\s]+/).filter(Boolean).map(Number);
  if (v.length && v.every(Number.isFinite)){ const w=v[0],h=v.length>1?v[1]:v[0]; bx=ax+(bx<ax?-1:1)*w; by=ay+(by<ay?-1:1)*h; }
  if (Math.abs(bx-ax)<1e-9 || Math.abs(by-ay)<1e-9){ toast('A rectangle needs some size'); return; }
  snapshot();
  const o=box(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay),.25,{left:S.mat,right:S.mat,top:S.mat});
  S.objs.push(o); S.tmp=null; S.typed=''; vcb(); S.sel={o,key:'top'}; describe(S.sel); draw();
  toast('Now pull it up with Push/Pull (P)');
}
function endLine(closed){
  const T=S.tmp; if(!T) return;
  if (T.p.length>=2){ snapshot(); S.marks.push({t:'line',p: closed ? [...T.p,T.p[0]] : T.p}); }
  S.tmp=null; S.typed=''; vcb(); draw();
}

/* ---- keyboard --------------------------------------------------------- */
addEventListener('keydown', e=>{
  if (e.ctrlKey||e.metaKey){ if(e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); } return; }
  if (/^[0-9.,;\- ]$/.test(e.key) && (S.tmp && e.key!==' ' || (drag && drag.k==='pull'))){ S.typed+=e.key; if(S.tmp) S.tmp.read=S.typed; vcb(); e.preventDefault(); return; }
  if (e.key==='Backspace'){ S.typed=S.typed.slice(0,-1); vcb(); return; }
  if (e.key==='Escape'){ if(drag&&drag.k==='pull'){drag.o.h=drag.h0;} drag=null; S.tmp=null; S.typed=''; vcb(); draw(); return; }
  if (e.key==='Enter'){
    const T=S.tmp, v=S.typed.split(/[,;\s]+/).filter(Boolean).map(Number).filter(Number.isFinite);
    if (!T){ return; }
    if (T.t==='rect') commitRect();
    else if (T.t==='circle' && v.length && v[0]>0){ snapshot(); S.marks.push({t:'circle',c:T.c,r:v[0]}); S.tmp=null; S.typed=''; vcb(); draw(); }
    else if (T.t==='line'){
      if (v.length){ const l=T.p[T.p.length-1], dx=T.cur[0]-l[0], dy=T.cur[1]-l[1], d=Math.hypot(dx,dy);
        if (d>0){ T.p.push([l[0]+dx/d*v[0], l[1]+dy/d*v[0]]); S.typed=''; vcb(); draw(); } else toast('Move the pointer to choose a direction'); }
      else endLine(false);
    }
    return;
  }
  const t = e.key===' ' ? TOOLS[0] : TOOLS.find(t=>t.key===e.key.toUpperCase());
  if (t && !e.altKey){ e.preventDefault(); setTool(t.id); }
});
/* typed distance applies to an active pull when Enter arrives mid-drag */
addEventListener('keyup', e=>{
  if (e.key==='Enter' && drag && drag.k==='pull'){
    const v=parseFloat(S.typed); if (Number.isFinite(v)){ drag.o.h=Math.max(.25,drag.h0+v); }
    drag=null; S.tmp=null; S.typed=''; vcb(); draw();
  }
});

$('#undo').onclick=undo;
$('#style').onclick=e=>{ S.sketchy=!S.sketchy; e.currentTarget.setAttribute('aria-pressed',S.sketchy); draw(); };
$('#top').onclick=e=>{ S.top=!S.top; e.currentTarget.setAttribute('aria-pressed',S.top); draw(); };
$('#shadow').oninput=e=>{ S.shadow=e.target.value/100; draw(); };
addEventListener('resize', fit);

mountTools(); syncMat(); startScene(); setTool('select'); fit();
window.SolidSketchPrototype = { S, setTool, fit, draw };   // handles for the README screenshots
</script>
</body>
</html>
