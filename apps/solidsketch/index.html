<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolidSketch</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-bin="solidsketch-web" data-wasm-opt="z" data-weak-refs />
  <meta name="theme-color" content="#1f2933" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1f2933; }
    #solidsketch_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #solidsketch_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #b8c2cc; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="solidsketch_canvas"></canvas>
  <div id="solidsketch_loading">Loading SolidSketch&hellip;</div>
</body>
</html>
